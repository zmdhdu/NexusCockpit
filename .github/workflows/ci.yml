name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend_design
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          # Dev tools (lint + test)
          pip install ruff pytest pytest-asyncio httpx
          # Lightweight runtime deps needed by test_v21.py import chain:
          #   test_v21 → nexus.core.cockpit_manager → nexus.core.logger → structlog
          #   nexus.core.logger → nexus.config → pydantic + pydantic-settings + python-dotenv
          pip install structlog pydantic pydantic-settings python-dotenv
      - name: Lint
        run: ruff check --output-format=github nexus/ tests/ scripts/
      # Type check (mypy) is run locally with the full conda environment.
      # CI only installs lightweight deps, so mypy would produce false positives
      # for missing modules (langfuse/redis/openai etc.).
      - name: Test
        run: pytest tests/test_v21.py -v

  gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend_design/nexus_gate
    steps:
      - uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: backend_design/nexus_gate/go.sum
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend_design
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
